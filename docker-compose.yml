services:
  traefik:
    image: traefik:v3.6   # use a versão mais recente da série 3.x
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true        # dashboard em localhost:8080 (só para dev)
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      proxy:
        aliases:
          - sequence-backend.localhost
          - painel-cliente-goon.localhost
          - estofadostreviso.localhost

networks:
  proxy:
    name: proxy